# render.yaml — Render.com Blueprint for INTELLI-CI
# Deploy the entire stack with one click from the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: intelli-ci-backend
    runtime: python
    region: singapore          # change to: oregon, frankfurt, ohio, virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intelli-ci-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379       # update if using Render Redis add-on
      - key: JWT_SECRET_KEY
        generateValue: true                 # Render auto-generates a secure random value
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GITHUB_CLIENT_ID
        sync: false                         # you fill this in the Render dashboard
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false                         # set to: https://<your-frontend>.onrender.com/auth/github/callback
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false                         # set to: https://<your-frontend>.onrender.com
      - key: PYTHONPATH
        value: /opt/render/project/src

  # ── Frontend (React Static Site) ──────────────────────────────────────────
  - type: web
    name: intelli-ci-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA routing — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false                         # set to: https://intelli-ci-backend.onrender.com/api/v1

# ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: intelli-ci-db
    databaseName: intellici
    user: intellici
    region: singapore
    plan: free
