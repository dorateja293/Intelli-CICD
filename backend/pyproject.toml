[project]
name = "intelli-ci"
version = "1.0.0"
description = "Intelligent CI/CD Platform with AI-powered error analysis"
requires-python = ">=3.11"

dependencies = [
    # Core Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis>=5.0.1",

    # Kafka
    "confluent-kafka>=2.3.0",

    # Elasticsearch
    "elasticsearch>=8.12.0",

    # HTTP Client
    "httpx>=0.26.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # YAML parsing
    "pyyaml>=6.0.1",

    # Email
    "aiosmtplib>=3.0.1",

    # Logging
    "structlog>=24.1.0",

    # Jinja2 for templates
    "jinja2>=3.1.3",

    # Markdown to HTML
    "markdown>=3.5.2",

    # Kubernetes client
    "kubernetes>=29.0.0",

    # Vault client
    "hvac>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
